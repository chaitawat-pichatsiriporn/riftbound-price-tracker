name: Weekly price update

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (10:00 Thailand time)
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          TCGCM_API_KEY: ${{ secrets.TCGCM_API_KEY }}
        run: node src/track.mjs
      - name: Save new prices to the repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Weekly prices $(date -u +%F)"
          git push
